  - id: M-09
    title: "Close the Edit/Write asymmetry on guardrail paths"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must change .claude/settings.json -- it is a guardrail path and the agent is denied Edit on it by design"
    refs: "21"
    goal: |
      The deny list protects guardrail paths with Edit(...) rules. Edit and Write are separate tools, so
      the rules may not cover a Write to the same path, and nothing covers a shell redirect. The
      guardrail CI job is the real enforcement boundary; the deny list currently reads as though it is
      one too, which is worse than it being openly advisory. This was not probed -- deliberately, since
      testing it would be an attempt to route around a guardrail.
    scope:
      - "the two protected sets are NOT the same set and neither is 'the four paths'. Edit-denied: docs/blueprint/**, .github/workflows/**, .claude/settings.json, scripts/audit-seams.sh, scripts/audit-identity.sh. CI-protected: .claude/settings.json, .github/workflows/, scripts/audit-*.sh, CLAUDE.md. CLAUDE.md has no Edit deny; docs/blueprint/** is absent from CI. Enumerate the union before acting"
      - "determine empirically whether Write and shell redirection are blocked on each path in that union"
      - "two holes are provable without probing anything: Bash(python3 *) is allowed and can write any file regardless of the Edit denies; and .claude/settings.json allows Bash(gh pr merge * --squash --delete-branch*) and Bash(git push -u origin *), which sit against CLAUDE.md section 8 'Landing is the owner's decision'"
      - "if they are not, either extend the deny rules or document the deny list as advisory with the CI job as the boundary"
      - "extend guardrails.yml coverage to .claude/agents/** and docs/adr/** -- the landing gate definition and the decision record are currently unprotected"
      - "the owner-approved label can currently be applied by the agent's own token; decide whether that should remain true"
    acceptance:
      - "for each path in the enumerated union, the result of a Write attempt and of a python3 file write is recorded (blocked or not)"
      - "guardrails.yml protects .claude/agents/** and docs/adr/** as well as the current four patterns"
      - "docs state which mechanism is the real boundary and which is advisory"
      - "no guardrail file is weakened by this issue: any change to them carries the owner-approved label"

  - id: M-10
    title: "Guardrail denies do not match sandbox worktree paths"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must change .claude/settings.json -- it is a guardrail path and the agent is denied Edit on it by design"
    refs: "21, 8.1"
    goal: |
      CORRECTED 2026-09-12 after a second measurement contradicted the first. The original filing said the
      denies never match a sandbox path. That is wrong. The real rule, measured in one session with the deny
      list unchanged throughout:
        - overwriting an EXISTING guarded file in a sandbox worktree is REFUSED (the protection holds);
        - creating a NEW file in a guarded directory in a sandbox worktree SUCCEEDS.
      Writing .sandboxes/<ID>/.github/workflows/claude-review.yml (new) succeeded; writing
      .sandboxes/<ID>/.github/workflows/guardrails.yml (existing) was refused; a probe file
      __deny-probe.yml (new) succeeded and was deleted.
      A new file is the more dangerous half: a brand-new workflow runs arbitrary code with the repository's
      secrets, and adding one never touches a file the deny knows about. Note also that a relative path in a
      Bash command resolves against the repo root, not the sandbox -- `rm .github/workflows/x` from inside a
      worktree was blocked as if it were the main tree.
    scope:
      - "deny patterns must match the guarded path inside a sandbox worktree as well as at the repo root"
      - "cover every current Edit deny: .github/workflows/**, .claude/settings.json, scripts/audit-*.sh, docs/blueprint/**"
      - "decide whether a PreToolUse hook is the right mechanism rather than more glob patterns"
      - "do not rely on the guardrails CI check alone -- an agent can apply the owner-approved label it reads"
    acceptance:
      - "creating a NEW file under .sandboxes/<ID>/.github/workflows/ is refused (recorded probe)"
      - "overwriting an existing guarded file in a sandbox stays refused -- do not regress what already works"
      - "the same two probes at the repo root are both refused"
      - "a write to an ordinary file inside a sandbox still succeeds -- the fix must not block normal work"
      - "each guarded path is probed new-file and existing-file, at root and sandbox depth, and the 16 results recorded"
      - "a relative path in Bash from inside a worktree cannot reach a guarded path in the main tree"

  - id: M-11
    title: "guardrails check reads labels from a stale event payload"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must apply the workflow change -- agents are denied Edit on .github/workflows/** and that deny held. A prepared replacement is carried on the open PR that also updates CLAUDE.md section 8; it is not in this tree"
    refs: "21"
    goal: |
      .github/workflows/guardrails.yml reads github.event.pull_request.labels.*.name -- a snapshot taken
      when the event fired -- and triggers on pull_request without the labeled type. So adding owner-approved
      never re-evaluates the check, and a re-run replays the original payload: measured on PR 33, where the
      re-run still expanded to `echo "needs-owner" | grep -qw owner-approved` after the label was changed.
      Close-and-reopen was the only remedy. The same snapshot behaviour means removing the label later fires
      no event, so a previously green guardrails result stands -- the check records that approval was once
      given, not that it is given at merge time.
    scope:
      - "re-evaluate on label change: add labeled and unlabeled to the trigger types, or query the label live via gh"
      - "prefer a live lookup: it fixes the revocation case as well as the addition case"
      - "state in the workflow comment why a re-run cannot fix a stale payload"
    acceptance:
      - "adding owner-approved to an open PR turns the check green without a push, a reopen or a re-run"
      - "removing owner-approved from an open PR turns the check red again"
      - "a PR touching no guardrail path still passes without any label"
      - "the check still fails a guardrail-path PR that has no label"

  - id: M-12
    title: "A shell write can overwrite a guarded file the Edit deny protects"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must change .claude/settings.json -- it is a guardrail path and the agent is denied Edit on it by design"
    refs: "21, 8.1"
    goal: |
      The denies in .claude/settings.json are per-tool. Edit(./.github/workflows/**) refuses the Edit and
      Write tools, and `cp` was refused too, but Bash(python3 *) is permitted and nothing inspects what a
      permitted interpreter writes. An agent that wanted to edit a guarded file could do so; the only thing
      stopping it on 2026-09-12 was choosing not to, and writing down that it had not. A permission file
      that holds only against agents that respect it is decorative.
      Distinct from M-10, which covers a NEW file escaping the deny by path. This is an EXISTING guarded
      file being overwritten through a permitted tool.
    scope:
      - "decide the mechanism: a PreToolUse hook that inspects write targets, or narrowing the interpreter allows"
      - "cover every guarded path, not only .github/workflows/**"
      - "the fix must not block an agent writing ordinary files with python3 or a shell heredoc -- that is normal work"
    acceptance:
      - "a python3 heredoc writing .github/workflows/x.yml is refused (recorded probe)"
      - "the same write to an ordinary path still succeeds (recorded probe)"
      - "each guarded path is probed through Edit, Write, cp, mv and python3, and the results recorded"
      - "no audit or check is weakened to make the probe pass"

  - id: M-13
    title: "The CI reviewer can judge an older commit than the one it comments on"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    refs: "16.1, 16.2"
    goal: |
      claude-review posts its verdict against the head SHA, but the content it read can be an earlier
      commit. Seen three times on 2026-09-12 -- PR 49, PR 55 and PR 60. On PR 60 every finding attached to
      head edf4e75 quoted line counts from four commits earlier and linked blob/0ae1b34; the PR was at
      exactly the 250-line budget and the duplication the finding named had already been removed.
      Both directions are harmful. A stale read can block a clean PR, which is what happened, and it can
      equally pass a PR whose defect was introduced in the commit it did not read -- and the SHA-bound
      marker does not protect against that. The marker binds the verdict to a commit; it does not bind
      the READING to that commit.
    scope:
      - "establish whether the cause is the action's checkout, gh pr diff caching, or the prompt"
      - "make the reviewer state which SHA it read, in the summary, so a stale read is visible without archaeology"
      - "consider having the proof step compare the SHA the reviewer names against the head it is verifying"
      - "a re-run that flips a verdict is indistinguishable from remediating this bug: decide whether the gate should record who triggered a re-run and why, or refuse a pass that only appeared after one"
    acceptance:
      - "the summary review names the SHA whose content was read"
      - "a review whose read SHA differs from the head SHA does not produce a pass marker (test or recorded run)"
      - "a normal review still passes unchanged -- the fix must not add a failure mode of its own"
      - "the three observed cases are re-checked against the fix and the results recorded"
      - "PR 60 is the worked example: changes-requested and pass on the identical SHA, 3h56m apart, the second after a re-run"

  # ------------------------------------------------------- Development scaffolding
  # Authored 2026-09-13 by the orchestrator under the owner's standing instruction:
  # "If the slice needs something the backlog does not cover -- a dev script, seed data, a way to
  # create a Project and a Task so the UI has something to show -- author the issue yourself, groom
  # it with a budget, and build it." Seed data is development scaffolding. It is NOT a migration,
  # and nothing in it may ever be depended on by production code.
  - id: D-01
    title: "Development seed data and a one-command dev run"
    phase: 0
    agent: spine-engineer
    size: S
    depends_on: [P0-05]
    refs: "14.1, 14.2, 15.2"
    change_budget: 700
    budget_reason: >-
      Re-groomed 2026-09-13 from 400 to 700 by the orchestrator, who authored this issue and its
      original estimate under the owner's standing delegation ("author the issue yourself, groom it
      with a budget, and build it"). This is a corrected estimate, NOT a budget waiver -- blueprint
      16.2 reserves waivers to the owner and none is claimed here. The 400 figure was wrong on its
      own terms: this issue's acceptance list demands three distinct basis states (fresh, stale and
      a genuinely indeterminate one) plus a mechanical test proving the replay and the refusal, and
      the implementation cannot meet its own acceptance criteria in 400 lines. The delivered change
      is 648, under the repository-wide default of 1250 set in #67. The alternative -- splitting
      scaffolding into two PRs -- buys reviewability that a 648-line seed script does not lack.
    goal: |
      Two commands take a clean clone to durable state worth rendering, so the gateway and the web
      shell have real snapshot and event history to read instead of a fixture. Every row the seed
      writes is ordinary durable truth -- same tables, same append path, same replay guarantees --
      so nothing downstream needs a "is this seeded?" branch.
      Seed data is development scaffolding and is labelled as such at every layer. It is not a
      migration: it does not live in migrations/, does not change the schema, and does not run as
      part of migrate().
    scope:
      - "scripts/seed.ts, run as `pnpm seed`: one owner, one org node, one role, one member, one project, several tasks"
      - "events appended through appendEvent so seeded history replays through readSince like any other"
      - "seeded tasks span distinct attention-relevant states, including at least one whose basis is genuinely unknown"
      - "writes to a dev database under state/, gitignored, never a production path"
      - "refuses to run against a non-empty database unless --reset is passed"
      - "console output states plainly that this is development seed data"
      - "`pnpm dev` script; it starts the gateway once P0-09 lands, and says so honestly until then"
    acceptance:
      - "pnpm seed on a clean clone produces a database whose event log replays contiguously from seq 0"
      - "at least one seeded task is in a state that must render as unknown, not as a guess (invariant 1)"
