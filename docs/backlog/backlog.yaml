version: 1
# Source of truth for all work. Issues are generated from here by scripts/bootstrap-issues.sh.
# Agents never invent scope. Add work here first, in a commit the owner can review.
#
# fields: id, title, phase, agent, size (S/M/L), depends_on[], blocked_gate (optional),
#         refs (blueprint sections), goal, scope[], acceptance[]

issues:

  # ------------------------------------------------------------------ Phase 0
  - id: P0-01
    title: "Toolchain: pnpm workspace, TypeScript project refs, vitest, verify gate"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: []
    refs: "19, 21"
    goal: >
      A repository skeleton where every later issue has somewhere to land and one command proves
      the invariants.
    scope:
      - pnpm workspaces for apps/*, packages/*, adapters/**
      - TypeScript strict, project references, no emit on the root
      - vitest, eslint, prettier with minimal opinionated config
      - "pnpm verify = typecheck + lint + test + scripts/audit-seams.sh + scripts/audit-identity.sh"
      - empty package folders per the §21 layout with a one-line README stating ownership
      - config/naming.ts holding every placeholder identifier (product, CLI, hostname, RP ID)
    acceptance:
      - "pnpm install && pnpm verify passes on a clean clone"
      - "audit scripts run as part of verify and fail the run on violation"
      - "no product name appears outside config/naming.ts"
      - "tsconfig strict: true, noUncheckedIndexedAccess: true, exactOptionalPropertyTypes: true"

  - id: P0-02
    title: "packages/protocol: event envelope, durable event union, ephemeral channel split"
    phase: 0
    agent: protocol-engineer
    size: M
    depends_on: [P0-01, M-04]
    refs: "Appendix A, 14.2"
    budget_waiver: |
      Owner, 2026-09-12, on issue #2 (blueprint 16.2 -- only the owner may waive, and the waiver is
      durable evidence). The 250-line budget is waived for this issue. Reason: 353 of 665 lines are one
      repeating declarative shape, and splitting a closed union leaves main in a state where the
      closed-union invariant is false.

    goal: The wire vocabulary, closed and versioned, with ephemeral data impossible to persist.
    scope:
      - "PROTOCOL_VERSION constant"
      - "event envelope: seq, ts, type, owner_id, org_node_id, project_id?, task_id?, attempt_id?, actor, payload, artifact_refs[]"
      - "Appendix A.3 spells the scope column workspace_id; that is an erratum (section 3 makes Project the core entity) -- see docs/adr/0004-protocol-event-vocabulary.md"
      - every durable event type from Appendix A as a discriminated union with typed payloads
      - ephemeral channel types in a separate module with no shared persistable base type
      - runtime validators for every durable event
    acceptance:
      - "exhaustive switch over durable events compiles with a never check"
      - "a test asserts the persistence layer's type signature cannot accept an ephemeral message"
      - "seam audit passes: no git or macOS vocabulary in any exported name or field (those are the patterns audit-seams.sh actually carries)"
      - "adding a type without bumping PROTOCOL_VERSION fails a test"

  - id: P0-03
    title: "packages/protocol: closed RenderableChange and ChangeAnchor unions (v1)"
    phase: 0
    agent: protocol-engineer
    size: M
    depends_on: [P0-02]
    refs: "5.2.1, Appendix D"
    goal: Review shapes the core knows without knowing how adapters produce them.
    scope:
      - "RenderableChange: text_patch, asset_delta, node_tree_delta, region_delta"
      - "ChangeAnchor: text_range, asset_id, node_path, region"
      - "ChangeSet: summary, RenderableChange refs, stable hash"
      - version-bump rule encoded as a test
    acceptance:
      - "unions are closed; a new shape requires a version bump and a renderer case"
      - "no adapter-supplied browser code path exists anywhere in the type surface"
      - "an asset_delta and a node_tree_delta fixture both validate and round-trip"
      - "change-set hash is stable across repeated serialization of the same content"

  - id: P0-04
    title: "packages/domain: DomainAdapter SPI types and lifecycle vocabulary"
    phase: 0
    agent: spine-engineer
    size: M
    depends_on: [P0-03]
    refs: "5.2, 2.4"
    goal: The provisional domain contract, in core vocabulary only.
    scope:
      - "all 13 SPI methods with typed inputs and outputs"
      - "Basis, Staleness (fresh | stale(reason) | unknown), Sandbox, SandboxInspection, SafetyRecord"
      - "CheckSpec/CheckResult, ApplyPlan/ApplyOperation, ReversalPlan, ReconcileResult"
      - "ReversibilityClass: revertible | compensable | irreversible"
    acceptance:
      - "no git vocabulary in any type, field, error string or doc comment (audit passes)"
      - "each SPI method's doc comment states the one-line binary-asset answer"
      - "ApplyPlan operations carry target_ref, required capability, risk and reversibility class"
      - "no type in this package can carry a credential-broker handle"

  - id: P0-05
    title: "packages/persistence: SQLite+WAL, migration v1, identity columns, event log"
    phase: 0
    agent: spine-engineer
    size: L
    depends_on: [P0-02]
    refs: "14.1, 14.2, 14.3"
    goal: One authoritative control-plane history that a human can inspect with sqlite3.
    scope:
      - better-sqlite3, WAL, foreign keys on, migration runner starting at v1
      - "tables for every §14.1 entity, with the notable fields listed in .claude/skills/sqlite-persistence"
      - "owner_id and org_node_id NOT NULL on every durable row and event"
      - append-only event log with monotonic seq and snapshot sequence support
      - artifact table with sha256 and retention_class
    acceptance:
      - "identity audit passes against the schema"
      - "a test asserts insertion without owner_id/org_node_id is rejected"
      - "migration test asserts the resulting constraints, not just that it ran"
      - "event seq monotonicity and replay-from-sequence covered by tests"
      - "no PTY bytes, token deltas or progress ticks are storable"

  - id: P0-06
    title: "packages/policy: capability lookup, role/project precedence, delegation invariants"
    phase: 0
    agent: spine-engineer
    size: M
    depends_on: [P0-05]
    change_budget: 900
    budget_reason: "a capability matrix is one repeating declarative row per capability; the logic is small"
    refs: "7.1, 7.2, 7.3"
    goal: Authorization as data, correct on day one with exactly one human owner.
    scope:
      - capability table lookup as the only authorization primitive
      - "Project owns change_unit and the safety floor; most-restrictive-wins for budget and evidence"
      - loosening role config is a load-time error with a precise message
      - "delegation invariants: no capability escalation, child budgets carved from parent remaining"
    acceptance:
      - "no isMe/isOwner branch anywhere (audit passes)"
      - "a role declaring a looser change_budget fails at config load with the offending path named"
      - "a role cannot task a role whose effective capabilities exceed its own (test)"
      - "a child budget cannot exceed parent remaining budget (test)"

  - id: P0-07
    title: "adapters/host/darwin: HostAdapter implementation plus test double"
    phase: 0
    agent: host-darwin-engineer
    size: L
    depends_on: [P0-04]
    change_budget: 1100
    budget_reason: "a host adapter plus a test double is two implementations of one interface by definition"
    refs: "06, Appendix B.3"
    goal: All host specifics behind a narrow surface, provably not leaking.
    scope:
      - "session_manager (tmux attach/reattach/list), autostart_contract (install/status/repair), path_policy, notify_local, health_probes, capabilities"
      - "capabilities reports egress_enforcement: advisory"
      - health probes surface permissions, power, disk and unlock state as data
      - a full HostAdapter test double usable on any platform
    acceptance:
      - "the core test suite passes against the test double on non-macOS"
      - "no host vocabulary outside this directory (audit passes)"
      - "autostart writes the plist and prints the owner-run procedure; it never executes launchctl"
      - "path_policy canonicalization and allow-roots covered by tests including traversal attempts"

  - id: P0-08
    title: "Persistent session proof: gateway restart does not kill a live agent session"
    phase: 0
    agent: host-darwin-engineer
    size: M
    depends_on: [P0-07, M-05]
    refs: "6.2, 9.2, 22"
    goal: The load-bearing Phase 0 exit proof.
    scope:
      - sessions owned by the session manager below the gateway, never node-pty children
      - "session identity records: provider_session_id, capture_method, captured_at, last_verified_at"
      - "session.reattached and session.resumed emitted as distinct durable events"
    acceptance:
      - "an automated test starts a session, restarts the gateway, and reattaches to the same live session"
      - "capture_method is recorded and status-parse capture is labelled as a fallback, never as truth"
      - "reattaching a terminal never emits session.resumed and vice versa"

  - id: P0-09
    title: "apps/gateway: snapshot endpoint plus durable event stream with sequence resume"
    phase: 0
    agent: spine-engineer
    size: L
    depends_on: [P0-05, P0-07]
    refs: "4.1, 15.1, 15.2"
    goal: One local gateway, one authority, typed operations only.
    scope:
      - "Fastify, GET /api/office/state returning snapshot plus its sequence"
      - WebSocket durable event stream resumable from a sequence
      - boundary validation using the protocol validators
      - static React asset serving
      - "no generic shell/filesystem authority exposed to the browser; terminal access via attach token only"
    acceptance:
      - "reconnect after missed events replays exactly the gap; incomplete recovery forces a fresh snapshot"
      - "office state never depends on ephemeral PTY or token data (test)"
      - "an unvalidated payload is rejected at the boundary with a typed error"
      - "no endpoint accepts an arbitrary command string"

  - id: P0-10
    title: "adapters/domain/code: full SPI over a git source of record"
    phase: 0
    agent: code-adapter-engineer
    size: L
    depends_on: [P0-04]
    change_budget: 1400
    budget_reason: "the full 13-method SPI over a real source of record: thirteen implementations, each small"
    refs: "5.3, 5.2.3, 13.2"
    goal: The first real adapter, with all substrate assumptions contained.
    scope:
      - "basis.ref from commit; inputs fingerprinted only for consulted resources"
      - sandbox as worktree; inspect_sandbox non-mutating with dirty/uncommitted_summary/retained_artifacts/safe_to_close
      - "compute_change_set and render_change_set producing text_patch shapes"
      - declared_checks and run_checks with skipped_reason and bounded retries
      - "apply_plan returning declarative operations; confirm_applied; revert_or_compensate; reconcile"
    acceptance:
      - "adapter passes the contract suite from P0-13"
      - "editing an unconsulted file does not stale a task; editing a consulted one does (test)"
      - "inspect_sandbox proven non-mutating by a hash-before/after test"
      - "no exported type, field or error string leaks git vocabulary across the seam"

  - id: P0-11
    title: "Basis staleness gate: pre-dispatch and post-queue re-check, unknown fails closed"
    phase: 0
    agent: spine-engineer
    size: M
    depends_on: [P0-06, P0-10]
    refs: "5.1, 10.2"
    goal: A stale plan can never be executed, and an unprovable one is never guessed.
    scope:
      - basis snapshot at brief time, re-check immediately before dispatch and again before mutation
      - "unknown requeues as blocked_basis_unknown and raises attention"
      - "task.basis.captured, task.stale, task.dispatched events"
    acceptance:
      - "unknown staleness refuses dispatch in a test, with no code path that proceeds"
      - "a long queue wait triggers a second re-check before mutation (test)"
      - "the Director role has no capability to override stale or unknown basis (test)"

  - id: P0-12
    title: "needs-repair, exclusive locks and frozen-lock disposition"
    phase: 0
    agent: spine-engineer
    size: M
    depends_on: [P0-11]
    refs: "10.2, 14.4"
    goal: Ambiguity freezes mutation and stays visibly recoverable.
    scope:
      - "RepairCase with probes, affected resources, allowed exits, resolution"
      - "Lock with disposition active | held-by-frozen-task"
      - "repair operations: reprobe, adopt, reset, release-lock"
      - "state.needs_repair, repair.requested, repair.resolved, repair.lock_released events"
    acceptance:
      - "needs-repair is read-only with respect to affected resources (test)"
      - "releasing a frozen lock is audited and does NOT resolve the RepairCase (test)"
      - "the Director cannot clear needs-repair or bypass a lock (test)"
      - "a blocked queue behind a frozen lock raises attention"

  - id: P0-13
    title: "Domain adapter contract suite, runnable against any adapter"
    phase: 0
    agent: contract-test-engineer
    size: L
    depends_on: [P0-04, M-05]
    change_budget: 1100
    budget_reason: "a contract suite is one case per SPI method per adapter, which is the point of it"
    refs: "20.1, 20.2"
    goal: The invariants become mechanical rather than remembered.
    scope:
      - one suite written against the SPI, parameterized by adapter
      - "coverage per .claude/skills/contract-testing (basis, sandbox, change set, checks, apply, repair)"
      - each test name quotes the blueprint section it enforces
    acceptance:
      - "suite runs green against the code adapter and is registered in pnpm verify"
      - "no adapter-private contract test exists"
      - "a deliberately non-compliant stub adapter fails the suite (negative test)"

  - id: P0-14
    title: "Apply planning, credential broker skeleton and action fingerprint"
    phase: 0
    agent: spine-engineer
    size: L
    depends_on: [P0-10, P0-06]
    refs: "5.2.2, 12.2, 12.3"
    goal: Irreversible consequences pass through the spine, never the adapter or the model.
    scope:
      - spine validates ApplyPlan against role capability, current basis, approval fingerprint, budget
      - "credential broker performs the privileged action; workers and adapters never hold secrets"
      - "action_fingerprint = hash({operation, project_id, task_id, basis_ref, change_set_hash, target_ref, apply_plan_hash, reversibility_class})"
      - "reversal is itself an ApplyPlan; apply.reversed / apply.compensated only after confirmed completion"
    acceptance:
      - "an adapter cannot obtain a broker handle (type-level test)"
      - "a plan whose fingerprint does not match the approval is rejected (test)"
      - "an irreversible operation without fresh verification is rejected (test)"
      - "security-reviewer sign-off recorded on the PR with no critical findings"

  - id: P0-15
    title: "adapters/provider: minimal Codex and Claude boundary with golden replays"
    phase: 0
    agent: provider-runtime-engineer
    size: M
    depends_on: [P0-02, P0-07]
    change_budget: 1200
    budget_reason: "two provider boundaries plus golden replay fixtures; fixtures dominate and are data"
    refs: "9.1, 9.3, 9.4, 20.4"
    goal: Two real runtimes behind a deliberately small substitution boundary.
    scope:
      - "start, cancel, send, status only"
      - normalizers mapping provider events to durable/ephemeral channels
      - "terminal BEL and prompt-state heuristics emitting agent.needs_input, clearable on focus/typing"
      - sanitized golden fixtures and a replay test
    acceptance:
      - "raw provider payloads never appear in durable events (test)"
      - "debug captures are opt-in, short-retention, hash-referenced files under state/debug"
      - "a changed fixture shape fails a test rather than corrupting state"
      - "no API key in code, fixtures, logs or tests"

  - id: P0-16
    title: "Config loader: projects, roles, org tree, context packs"
    phase: 0
    agent: spine-engineer
    size: M
    depends_on: [P0-06]
    refs: "7.2, 13.1, Appendix B"
    goal: Seam C and context are versioned data from day one.
    scope:
      - "load config/roles, config/org, config/context-packs, project definitions per Appendix B"
      - "ContextPack as a named, versioned, hashable resource set; roles declare which packs they may consult"
      - load-time validation with precise error paths
    acceptance:
      - "the Appendix B code and asset project examples load and validate"
      - "an invalid or loosening config fails at load with the offending path named"
      - "a brief records the resource_id/version pairs actually consulted, not a directory hash"

  - id: P0-17
    title: "Artifacts, retention classes and reference-guarded GC"
    phase: 0
    agent: spine-engineer
    size: M
    depends_on: [P0-05]
    change_budget: 700
    budget_reason: "retention classes times GC guards is a table of cases, not branching logic"
    refs: "14.3"
    goal: Evidence outlives the run that produced it, and nothing needed is ever collected.
    scope:
      - "retention classes: transient, task-evidence, milestone, build-cache (LRU)"
      - "artifact.created events, sha256, path/ref, owner task/attempt"
      - GC pass with reference guards
    acceptance:
      - "GC never deletes an artifact referenced by an unresolved RepairCase, Approval, ReviewThread or retained milestone (test)"
      - "transient artifacts expire; milestone artifacts never expire (test)"
      - "backup documentation covers DB plus artifacts plus config"

  - id: P0-18
    title: "packages/attention: durable attention states and derivation"
    phase: 0
    agent: spine-engineer
    size: M
    depends_on: [P0-12]
    refs: "8.4, 17.1, 18.3"
    goal: One derivation of "what needs the owner", used by every surface.
    scope:
      - "states: needs_input, review-ready, blocked, lock-held, needs-repair, unknown, awaiting_user_verification"
      - derivation from snapshot plus durable events only
      - "watchdogs as tokenless deterministic code: undelivered approval, unresolved steer, long lock queue"
    acceptance:
      - "awaiting_user_verification is distinct from pending approval and can never time out into authorization (test)"
      - "every attention item is reconstructable from durable truth after a restart (test)"
      - "no attention watcher consumes model tokens to observe time passing"

  - id: P0-19
    title: "Phase 0 exit gate: run gate-check and record the evidence"
    phase: 0
    agent: adr-scribe
    size: S
    depends_on: [P0-08, P0-09, P0-13, P0-14, P0-18]
    refs: "22, 23"
    goal: Phase 0 ends on evidence, not on the feeling of being done.
    scope:
      - "./scripts/gate-check.sh 0"
      - dated gate record ADR stating the command and output that proves each condition
    acceptance:
      - "gateway restart with surviving live session demonstrated and recorded"
      - "vocabulary and identity audits green"
      - "Phase 0 contract tests green"
      - "any UNPROVEN condition is listed with the issue that would close it"

  # ------------------------------------------------------------------ Phase 1

  - id: P1-01
    title: "Canonical origin: routing design, throwaway-hostname proof runbook"
    phase: 1
    agent: host-darwin-engineer
    size: M
    depends_on: [P0-09]
    blocked_gate: "canonical-origin proof and naming clearance (docs/gates/phase-minus-1.md)"
    refs: "11.3, Appendix D"
    goal: One origin over both network paths, proven before any passkey exists.
    scope:
      - config surface for the canonical origin, with placeholder hostname only
      - private path (Tailscale) and fallback path (Cloudflare) documented as owner-run steps
      - runbook proving both paths terminate at the same origin on a throwaway hostname
    acceptance:
      - "no real hostname, DNS record or RP ID is registered by an agent"
      - "runbook is executable by the owner in under 30 minutes"
      - "code reads the origin from config; no hardcoded host anywhere"

  - id: P1-02
    title: "apps/web shell: mobile-first UI, attention inbox, snapshot plus event wiring"
    phase: 1
    agent: web-engineer
    size: L
    depends_on: [P0-09, P0-18]
    refs: "11.1, 16.5, 17.3"
    goal: A phone surface that answers the three-second glance test.
    scope:
      - React + Vite + Tailwind, mobile-first, no component library, no SSR
      - "attention inbox as the home surface; unknown and needs-repair visibly distinct"
      - "snapshot load then event stream resume; fresh snapshot on incomplete recovery"
    acceptance:
      - "three-second glance answers: what needs me, what is blocked, what is unknown"
      - "no spinner or optimistic state implies progress that cannot be proven"
      - "renderer handles every protocol shape exhaustively; a missing case is a build error"
      - "bundle loads on mobile data (state the measured size in the evidence comment)"

  - id: P1-03
    title: "Mobile terminal attach via xterm.js and gateway attach tokens"
    phase: 1
    agent: web-engineer
    size: M
    depends_on: [P1-02, P0-08]
    refs: "4.2, 11.1"
    goal: The owner can drive a live session from a phone without the browser holding credentials.
    scope:
      - xterm.js attaching through a short-lived gateway attach token
      - reattach after network loss, on-screen input affordances for mobile
    acceptance:
      - "the browser never receives shell or filesystem credentials (test)"
      - "attach token is short-lived, scoped to one session, and single-purpose"
      - "reattach after a dropped connection resumes the same live session"

  - id: P1-04
    title: "Read-only change-set view marked unchecked before evidence exists"
    phase: 1
    agent: web-engineer
    size: M
    depends_on: [P1-02, P0-10]
    refs: "16.1, 16.2, 23"
    goal: Review can begin before the trust loop exists, without implying evidence it lacks.
    scope:
      - text_patch rendering with per-file triage (okay / look closer)
      - "prominent unchecked marking; skipped and flaky checks visible, not buried"
    acceptance:
      - "a change set with no evidence is clearly marked unchecked (visual test or screenshot artifact)"
      - "manual-required evidence is never rendered as green-equivalent"
      - "review-ready is read from computed mechanics state, never derived in the UI"

  - id: P1-05
    title: "Preview port broker and per-preview routing"
    phase: 1
    agent: spine-engineer
    size: M
    depends_on: [P0-09]
    refs: "11.2"
    goal: Several previews coexist and none of them assumes it owns port 3000.
    scope:
      - "gateway-allocated ports; Preview entity with port, canonical route, health, owner task/attempt"
      - "independent routing per preview; no path-prefix proxying"
      - "preview.started / healthy / failed / stopped events"
    acceptance:
      - "two previews run concurrently without collision (test)"
      - "a root-assuming web app and a compressed WebGL build both load correctly"
      - "health transitions are durable events, not polled UI state"

  - id: P1-06
    title: "Notification relay with delivery lifecycle and watchdog"
    phase: 1
    agent: spine-engineer
    size: M
    depends_on: [P0-18]
    refs: "11.4, 18.3"
    goal: The phone view distinguishes "waiting for you" from "you never got it".
    scope:
      - "relay channel (ntfy / Telegram / Slack) with a deep link into the canonical origin"
      - "requested -> queued -> delivered -> opened -> decided tracking where supported"
      - delivery watchdog escalating delivery failure separately from owner delay
      - background WebSocket explicitly not the primary phone channel
    acceptance:
      - "delivered is never emitted merely because a send function was called (test)"
      - "a simulated relay failure produces a delivery incident, not a silent wait"
      - "no secret or task content leaks into a third-party notification payload beyond what the owner configured"

  - id: P1-07
    title: "Presence claim, heartbeat and lease with dirty-state protection"
    phase: 1
    agent: spine-engineer
    size: M
    depends_on: [P0-12]
    refs: "10.3, 10.4"
    goal: Explicit human presence, never inferred, and never a reason to destroy work.
    scope:
      - "claim / heartbeat / release via CLI and UI; expiry as a durable event"
      - dirty state blocks destructive cleanup whether or not a claim is active
    acceptance:
      - "presence is never inferred from file mtimes (test)"
      - "a dirty sandbox cannot be destroyed without a recorded policy outcome (test)"
      - "claim expiry raises attention rather than silently releasing work"

  - id: P1-08
    title: "Real cost ceilings, budget ledger enforcement and retry circuit breaker"
    phase: 1
    agent: spine-engineer
    size: M
    depends_on: [P0-06]
    blocked_gate: "owner must set real monthly/hourly/task/run ceilings (docs/gates/phase-minus-1.md)"
    refs: "18.2, Appendix D"
    goal: Automation stays disabled until real numbers exist; placeholders are not configuration.
    scope:
      - "monthly, daily/hourly, task and run ceilings from owner config"
      - "BudgetReservation and BudgetLedger enforcement, mid-run checks before expensive continuation"
      - "retry circuit breaker; budget.threshold and budget.pause events"
      - "threshold crossing: stop scheduling, interrupt safe activities, drain unsafe ones, checkpoint, notify"
    acceptance:
      - "startup refuses to enable automation while ceilings are placeholders (test)"
      - "a mid-run threshold crossing checkpoints and notifies rather than aborting unsafely (test)"
      - "no role can raise its own budget (test)"

  - id: P1-09
    title: "Usable gate: Phase 1 acceptance script, friction log, STOP & USE notice"
    phase: 1
    agent: adr-scribe
    size: S
    depends_on: [P1-02, P1-03, P1-04, P1-05, P1-06, P1-07]
    refs: "22, 23"
    goal: Phase 1 ends in a deliberate pause, not momentum into Phase 2.
    scope:
      - "acceptance script covering the §23 usable gate"
      - friction log template for two weeks of daily use
      - "a visible STOP & USE notice in README and CLAUDE.md phase section"
    acceptance:
      - "live terminal survives gateway restart, canonical origin works, change sets marked unchecked, preview/notification/claim flows work from phone"
      - "friction log template exists and the two-week clock is recorded with a start date"
      - "no Phase 2 issue is created until the friction log justifies it"

  - id: M-01
    title: "Fix gate-check.sh: correct pnpm invocation and report UNPROVEN for an empty scan"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    refs: "20, 22, 23"
    goal: |
      A gate check that cannot be trusted is worse than no gate check. Two lines of phase-0 output are
      currently wrong in opposite directions, so the script must be repaired before any gate verdict is
      treated as meaningful.
    scope:
      - "condition 0.2 runs `pnpm -s verify`, which pnpm 12 rejects with `unexpected argument '-s'`, so it reports FAIL unconditionally; use `pnpm --silent run verify`"
      - "condition 0.1 prints PASS when the audits scanned nothing, because every check is guarded by `[[ -d ]]` over directories that may not exist; it must print UNPROVEN instead"
      - "distinguish 'the check ran and passed' from 'the check had nothing to look at' everywhere in the script"
    acceptance:
      - "0.2 reflects the real exit status of the verify script, proven by running it against a branch where verify passes and one where it fails"
