version: 1
# Source of truth for all work. Issues are generated from here by scripts/bootstrap-issues.sh.
# Agents never invent scope. Add work here first, in a commit the owner can review.
#
# fields: id, title, phase, agent, size (S/M/L), depends_on[], blocked_gate (optional),
#         refs (blueprint sections), goal, scope[], acceptance[]

issues:

  # ------------------------------------------------------------------ Phase 0
  - id: P0-01
    title: "Toolchain: pnpm workspace, TypeScript project refs, vitest, verify gate"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: []
    refs: "19, 21"
    goal: >
      A repository skeleton where every later issue has somewhere to land and one command proves
      the invariants.
    scope:
      - pnpm workspaces for apps/*, packages/*, adapters/**
      - TypeScript strict, project references, no emit on the root
      - vitest, eslint, prettier with minimal opinionated config
      - "pnpm verify = typecheck + lint + test + scripts/audit-seams.sh + scripts/audit-identity.sh"
      - empty package folders per the §21 layout with a one-line README stating ownership
      - config/naming.ts holding every placeholder identifier (product, CLI, hostname, RP ID)
    acceptance:
      - "pnpm install && pnpm verify passes on a clean clone"
      - "audit scripts run as part of verify and fail the run on violation"
      - "no product name appears outside config/naming.ts"
      - "tsconfig strict: true, noUncheckedIndexedAccess: true, exactOptionalPropertyTypes: true"

  - id: P0-02
    title: "packages/protocol: event envelope, durable event union, ephemeral channel split"
    phase: 0
    agent: protocol-engineer
    size: M
    depends_on: [P0-01, M-04]
    refs: "Appendix A, 14.2"
    budget_waiver: |
      Owner, 2026-09-12, on issue #2 (blueprint 16.2 -- only the owner may waive, and the waiver is
      durable evidence). The 250-line budget is waived for this issue. Reason: 353 of 665 lines are one
      repeating declarative shape, and splitting a closed union leaves main in a state where the
      closed-union invariant is false.

    goal: The wire vocabulary, closed and versioned, with ephemeral data impossible to persist.
    scope:
      - "PROTOCOL_VERSION constant"
      - "event envelope: seq, ts, type, owner_id, org_node_id, project_id?, task_id?, attempt_id?, actor, payload, artifact_refs[]"
      - "Appendix A.3 spells the scope column workspace_id; that is an erratum (section 3 makes Project the core entity) -- see docs/adr/0004-protocol-event-vocabulary.md"
      - every durable event type from Appendix A as a discriminated union with typed payloads
      - ephemeral channel types in a separate module with no shared persistable base type
      - runtime validators for every durable event
    acceptance:
      - "exhaustive switch over durable events compiles with a never check"
      - "a test asserts the persistence layer's type signature cannot accept an ephemeral message"
      - "seam audit passes: no git or macOS vocabulary in any exported name or field (those are the patterns audit-seams.sh actually carries)"
      - "adding a type without bumping PROTOCOL_VERSION fails a test"

