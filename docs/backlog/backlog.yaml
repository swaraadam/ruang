      - "pin the toolchain so CI and local agree — the repo has no packageManager field, so corepack picks a default pnpm major"
      - "record that agents are denied Edit on .github/workflows/** and why"
      - "state the ordering constraint: `pnpm install --frozen-lockfile` needs a committed lockfile, so CI cannot pass on a branch whose base lacks one"
    acceptance:
      - "a drift check fails if the workflow job name and the branch-protection required context stop matching (they agree today; nothing detects it if they diverge)"
      - "a packageManager field pins the pnpm major, and CI uses it rather than a corepack default"
      - "CI resolves the pinned pnpm major rather than a corepack default, shown by the version line in the run log"
      - "docs name every guardrail path in the settings deny list (docs/blueprint/**, .github/workflows/**, .claude/settings.json, scripts/audit-seams.sh, scripts/audit-identity.sh) and state the escalation route for each"

  - id: M-04
    title: "Decide module resolution: emitted ESM must resolve under node"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    refs: "19, 20, 21"
    goal: |
      tsconfig.base.json sets module ES2022 + moduleResolution bundler. Combined with the "type":"module"
      and exports fields P0-01 added, any member with more than one source file emits extensionless
      relative imports that node cannot resolve, and pnpm verify exits 0 while it happens. P0-02 is
      packages/protocol, a multi-file package everything else imports, so the trap fires there first.
    scope:
      - "reproduce: a second file in packages/protocol emits `export { X } from './helper'`; node reports ERR_MODULE_NOT_FOUND while tsc -b exits 0"
      - "decide the resolution mode deliberately — nodenext makes it a compile-time TS2835 and fails closed, but apps/web builds under Vite and apps/gateway runs under node, and they may not want the same base"
      - "if the two need different modes, say so explicitly rather than forcing one base"
      - "add a check so emitted output that node cannot import fails the build rather than shipping"
    acceptance:
      - "a multi-file member is added and its emitted dist is imported by node successfully (test)"
      - "the failure mode is caught at build time, not at import time — an extensionless emitted specifier fails verify (test)"
      - "the chosen mode is recorded with its reasoning, including what it means for apps/web under Vite and apps/gateway under node"
      - "P0-01's existing single-file members still pass unchanged"

  - id: M-05
    title: "gate-check conditions must prove themselves by running a test, not by grepping for a string"
    phase: 0
    agent: contract-test-engineer
    size: M
    depends_on: [P0-01]
    refs: "20, 22, 23"
    goal: |
      Conditions 0.3 and 0.4 assert a phase-exit condition from the textual presence of a string in any
      .ts file. That is not evidence, and it is actively dangerous: during M-01 a regression test whose
      fixture strings happened to be those phrases made the gate report "GATE 0: all conditions PASS",
      exit 0, with P0-08 and P0-13 never started. Narrowing where the grep looks does not fix it -- that
      was tried and it created a second instance of the same defect. A condition must run something and
      read its result.
    scope:
      - "0.3 and 0.4 must execute a named test and read its exit code, or report UNPROVEN -- no third option"
      - "ban `grep -r` from gate-check.sh entirely; presence of text is never evidence a check passed"
      - "0.3 also infers from a filename glob (`ls adapters/host/darwin/**/*session*restart*`), which is the same defect without a grep: a zero-byte file with a matching name flips it to PASS. A filename is not evidence either"
      - "the positive rule is the real constraint, not the banned spellings: a condition runs something and reads its result, or reports UNPROVEN"
      - "print the command that proves each condition, per .claude/skills/phase-gates/SKILL.md"
      - "print the basis the verdict was computed against -- repo path, HEAD, and whether the tree is dirty. ADR-0002 recorded this by hand; the gate should state its own basis (CLAUDE.md section 3, basis.ref plus basis.inputs)"
      - "the final `all conditions PASS` line is derived from RC=0, i.e. the absence of a failure, with no count of expected conditions -- assert the expected number of conditions actually reported"
      - "0.3's PASS text currently reads 'inspect its output before trusting it', which is UNPROVEN with extra words -- resolve it"
      - "recursion applies to running the WHOLE suite: 0.2 shells out to `pnpm run verify` -> vitest -> tests/gate-check.test.ts -> the gate. Running a single NAMED test does not re-enter, so the mandate above is implementable"
      - "gate-check.sh:66 (`grep -q STOP_AND_USE_START docs/gates/*.md`) is a deliberate exclusion: that fact really is documentary. Say so rather than leaving it as an inconsistency"
      - "a machine-readable artifact written by the real test run is the suggested shape, but a results file is ALSO just text in a file -- it only counts as evidence if it is provenance-bound and freshness-bound"
      - "IF an artifact is used at all, it carries the commit ref and timestamp of the run that produced it, and stale or unparseable is UNPROVEN -- but read the next two bullets before choosing that design at all"
      - "but freshness is not authenticity: the overnight agent writes to the same filesystem the gate reads, and `git rev-parse HEAD` is one command away, so a forged artifact passes any HEAD check. Nor does HEAD-binding catch a dirty tree -- sources change while HEAD does not (CLAUDE.md section 3 draws exactly this line between basis.ref and basis.inputs)"
      - "REQUIRED, not merely preferred: since a named test does not re-enter the gate, the artifact has no reason to exist. Run the test. Any artifact is an optional cache only -- its ABSENCE means run the test, and its PRESENCE never by itself justifies PASS. A present, fresh, correctly-signed artifact is still not evidence; only a run is"
      - "it lives under state/artifacts/, which IS gitignored -- state/ itself is not, so state/gate/results.json would be fully committable and the guarantee would evaporate"
    acceptance:
      - "no `grep -r` remains in gate-check.sh (test)"
      - "adding a .ts file containing the literal strings 0.3 and 0.4 used to grep for does not change any condition's verdict (test -- this is the exact M-01 regression)"
      - "adding a zero-byte file named adapters/host/darwin/tests/session-restart.test.ts does not change 0.3's verdict (test -- verified today: on main it flips UNPROVEN to PASS)"
      - "0.3 and 0.4 report PASS only when a named test actually ran and exited 0, proven by making that test fail and observing the verdict change"
      - "a HAND-WRITTEN artifact claiming pass, carrying a correct `git rev-parse HEAD` and a current timestamp, does not produce PASS (test). This is the path no other criterion exercises, and it is the closest analogue to how the original incident happened"
      - "running the gate does not re-enter itself: assert a re-entrancy guard, not a wall-clock bound. A bounded two-level recursion finishes quickly while still re-entering, and a legitimately slow verify is not a recursion (test)"
      - "`./scripts/gate-check.sh 0` output is reproduced in the evidence for: all-unproven, condition-passing, and condition-failing cases"

  - id: M-06
    title: "0.1 must not claim coverage the audits do not have"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [M-05]
    blocked_gate: "only the audits know which checks examined what, but scripts/audit-*.sh are guardrail paths an agent may not edit. Deriving coverage from outside them means censusing files, which IS the existence-sniffing family this issue exists to remove. Owner must either approve the audits emitting their own coverage, or accept a weaker gate"
    refs: "21, 23"
    goal: |
      0.1 prints "audits green over adapters apps packages", which reads as full coverage. It is not.
      The repository contains zero .sql files, so the identity audit's durable-table check -- the one
      enforcing invariant 8's owner_id/org_node_id -- examines nothing while 0.1 reports PASS. A scan
      root existing, or even containing files, does not mean every check inside the audits ran.
    scope:
      - "report per-check coverage rather than a single PASS: which invariant checks actually examined files, and which had nothing to examine"
      - "a check with nothing to examine is UNPROVEN for that invariant, even when its sibling checks pass"
      - "invariant 8's SQL half is the live example: zero .sql files today"
      - "do not edit scripts/audit-seams.sh or scripts/audit-identity.sh -- they are guardrail files requiring owner approval; the gate owns its own verdict semantics"
    acceptance:
      - "with zero .sql files present, 0.1 does not report unqualified PASS for invariant 8 (test)"
      - "a zero-byte packages/domain/src/index.ts also does not report PASS -- narrowing the existence test (e.g. adding -name '*.ts') is NOT a fix, it is the same move that created a second instance of the defect during M-01 (test)"
      - "a tree whose only file under packages/domain is a zero-byte .keep or a one-line README does not report PASS for 0.1 (test -- verified: gate-check.sh:32 uses `find -type f -print -quit`, so ANY regular file arms it. This is armed today by design: P0-01 mandates a one-line README in every package folder, so 0.1 currently reports PASS with zero source files examined)"
      - "with packages/persistence/migrations/schema.sql present and clean, invariant 8 reports PASS (test). Name the path: audit-identity.sh globs migrations/*.sql and persistence/*/*.sql with globstar off, so a .sql at the repo root or at packages/persistence/x.sql is never examined"
      - "a tree where only apps/ exists does not report PASS for invariant 9, whose scan set is packages/domain and packages/protocol (test)"
      - "no audit script is modified: `git diff origin/main -- scripts/audit-seams.sh scripts/audit-identity.sh` is empty (origin/main, not main -- local main lags in a per-issue worktree)"

  - id: M-07
    title: "gate-check must distinguish a failing check from a runner that never ran"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [M-05]
    refs: "23"
    goal: |
      0.2 runs `pnpm --silent run verify >/dev/null 2>&1` and treats any non-zero exit as "verify
      failing". It cannot tell a real failure from pnpm being absent, or from a future pnpm rejecting
      --silent the way pnpm 12 rejected -s. That is the exact shape of the bug M-01 fixed, still present
      one level up. It fails closed, so it is not a safety hole -- it is a truthfulness hole.
    scope:
      - "guard on the runner being present and usable before interpreting its exit code"
      - "a missing or incompatible runner is UNPROVEN, not FAIL -- the check did not run"
      - "the same reasoning applies to any other external command a condition depends on"
    acceptance:
      - "with pnpm unavailable on PATH, 0.2 reports UNPROVEN and not FAIL (test)"
      - "with a verify script that exits non-zero, 0.2 reports FAIL (test)"
      - "with a verify script that exits 0, 0.2 reports PASS (test)"

  - id: M-08
    title: "CI must run on main, not only on pull requests"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must apply the workflow change, or grant an agent Edit on .github/workflows/** (it is a guardrail path requiring the owner-approved label)"
    refs: "20, 22"
    goal: |
      Both workflows trigger on pull_request only, so nothing ever checks main. An overnight run's
      "CI red on main" stop condition therefore has no signal behind it, and a bad merge -- or a merge
      whose result differs from what was tested on the branch -- is invisible until the next PR.
    scope:
      - "run verify on push to main as well as on pull_request"
      - "decide whether guardrails should also run on main, or whether it is inherently a PR-time check"
      - "state what an operator should do when main goes red, since no PR is open to fix"
    acceptance:
      - "a push to main triggers verify, shown by a run in the Actions list with event=push"
      - "the branch-protection required contexts still match the workflow job names after the change"
      - "an unattended run can distinguish 'main is green' from 'main was never checked'"

  - id: M-09
    title: "Close the Edit/Write asymmetry on guardrail paths"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must change .claude/settings.json -- it is a guardrail path and the agent is denied Edit on it by design"
    refs: "21"
    goal: |
      The deny list protects guardrail paths with Edit(...) rules. Edit and Write are separate tools, so
      the rules may not cover a Write to the same path, and nothing covers a shell redirect. The
      guardrail CI job is the real enforcement boundary; the deny list currently reads as though it is
      one too, which is worse than it being openly advisory. This was not probed -- deliberately, since
      testing it would be an attempt to route around a guardrail.
    scope:
      - "the two protected sets are NOT the same set and neither is 'the four paths'. Edit-denied: docs/blueprint/**, .github/workflows/**, .claude/settings.json, scripts/audit-seams.sh, scripts/audit-identity.sh. CI-protected: .claude/settings.json, .github/workflows/, scripts/audit-*.sh, CLAUDE.md. CLAUDE.md has no Edit deny; docs/blueprint/** is absent from CI. Enumerate the union before acting"
      - "determine empirically whether Write and shell redirection are blocked on each path in that union"
      - "two holes are provable without probing anything: Bash(python3 *) is allowed and can write any file regardless of the Edit denies; and .claude/settings.json allows Bash(gh pr merge * --squash --delete-branch*) and Bash(git push -u origin *), which sit against CLAUDE.md section 8 'Landing is the owner's decision'"
      - "if they are not, either extend the deny rules or document the deny list as advisory with the CI job as the boundary"
      - "extend guardrails.yml coverage to .claude/agents/** and docs/adr/** -- the landing gate definition and the decision record are currently unprotected"
      - "the owner-approved label can currently be applied by the agent's own token; decide whether that should remain true"
    acceptance:
      - "for each path in the enumerated union, the result of a Write attempt and of a python3 file write is recorded (blocked or not)"
      - "guardrails.yml protects .claude/agents/** and docs/adr/** as well as the current four patterns"
      - "docs state which mechanism is the real boundary and which is advisory"
      - "no guardrail file is weakened by this issue: any change to them carries the owner-approved label"

  - id: M-10
    title: "Guardrail denies do not match sandbox worktree paths"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must change .claude/settings.json -- it is a guardrail path and the agent is denied Edit on it by design"
    refs: "21, 8.1"
    goal: |
      CORRECTED 2026-09-12 after a second measurement contradicted the first. The original filing said the
      denies never match a sandbox path. That is wrong. The real rule, measured in one session with the deny
      list unchanged throughout:
        - overwriting an EXISTING guarded file in a sandbox worktree is REFUSED (the protection holds);
        - creating a NEW file in a guarded directory in a sandbox worktree SUCCEEDS.
      Writing .sandboxes/<ID>/.github/workflows/claude-review.yml (new) succeeded; writing
      .sandboxes/<ID>/.github/workflows/guardrails.yml (existing) was refused; a probe file
      __deny-probe.yml (new) succeeded and was deleted.
      A new file is the more dangerous half: a brand-new workflow runs arbitrary code with the repository's
      secrets, and adding one never touches a file the deny knows about. Note also that a relative path in a
      Bash command resolves against the repo root, not the sandbox -- `rm .github/workflows/x` from inside a
      worktree was blocked as if it were the main tree.
    scope:
      - "deny patterns must match the guarded path inside a sandbox worktree as well as at the repo root"
      - "cover every current Edit deny: .github/workflows/**, .claude/settings.json, scripts/audit-*.sh, docs/blueprint/**"
      - "decide whether a PreToolUse hook is the right mechanism rather than more glob patterns"
      - "do not rely on the guardrails CI check alone -- an agent can apply the owner-approved label it reads"
    acceptance:
      - "creating a NEW file under .sandboxes/<ID>/.github/workflows/ is refused (recorded probe)"
      - "overwriting an existing guarded file in a sandbox stays refused -- do not regress what already works"
      - "the same two probes at the repo root are both refused"
      - "a write to an ordinary file inside a sandbox still succeeds -- the fix must not block normal work"
      - "each guarded path is probed new-file and existing-file, at root and sandbox depth, and the 16 results recorded"
      - "a relative path in Bash from inside a worktree cannot reach a guarded path in the main tree"

  - id: M-11
    title: "guardrails check reads labels from a stale event payload"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must apply the workflow change -- agents are denied Edit on .github/workflows/** and that deny held. A prepared replacement is carried on the open PR that also updates CLAUDE.md section 8; it is not in this tree"
    refs: "21"
    goal: |
      .github/workflows/guardrails.yml reads github.event.pull_request.labels.*.name -- a snapshot taken
      when the event fired -- and triggers on pull_request without the labeled type. So adding owner-approved
      never re-evaluates the check, and a re-run replays the original payload: measured on PR 33, where the
      re-run still expanded to `echo "needs-owner" | grep -qw owner-approved` after the label was changed.
      Close-and-reopen was the only remedy. The same snapshot behaviour means removing the label later fires
      no event, so a previously green guardrails result stands -- the check records that approval was once
      given, not that it is given at merge time.
    scope:
      - "re-evaluate on label change: add labeled and unlabeled to the trigger types, or query the label live via gh"
      - "prefer a live lookup: it fixes the revocation case as well as the addition case"
      - "state in the workflow comment why a re-run cannot fix a stale payload"
    acceptance:
      - "adding owner-approved to an open PR turns the check green without a push, a reopen or a re-run"
      - "removing owner-approved from an open PR turns the check red again"
      - "a PR touching no guardrail path still passes without any label"
      - "the check still fails a guardrail-path PR that has no label"

  - id: M-12
    title: "A shell write can overwrite a guarded file the Edit deny protects"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must change .claude/settings.json -- it is a guardrail path and the agent is denied Edit on it by design"
    refs: "21, 8.1"
    goal: |
      The denies in .claude/settings.json are per-tool. Edit(./.github/workflows/**) refuses the Edit and
      Write tools, and `cp` was refused too, but Bash(python3 *) is permitted and nothing inspects what a
      permitted interpreter writes. An agent that wanted to edit a guarded file could do so; the only thing
      stopping it on 2026-09-12 was choosing not to, and writing down that it had not. A permission file
      that holds only against agents that respect it is decorative.
      Distinct from M-10, which covers a NEW file escaping the deny by path. This is an EXISTING guarded
      file being overwritten through a permitted tool.
    scope:
      - "decide the mechanism: a PreToolUse hook that inspects write targets, or narrowing the interpreter allows"
      - "cover every guarded path, not only .github/workflows/**"
      - "the fix must not block an agent writing ordinary files with python3 or a shell heredoc -- that is normal work"
    acceptance:
      - "a python3 heredoc writing .github/workflows/x.yml is refused (recorded probe)"
      - "the same write to an ordinary path still succeeds (recorded probe)"
      - "each guarded path is probed through Edit, Write, cp, mv and python3, and the results recorded"
      - "no audit or check is weakened to make the probe pass"

  - id: M-13
    title: "The CI reviewer can judge an older commit than the one it comments on"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    refs: "16.1, 16.2"
    goal: |
      claude-review posts its verdict against the head SHA, but the content it read can be an earlier
      commit. Seen three times on 2026-09-12 -- PR 49, PR 55 and PR 60. On PR 60 every finding attached to
      head edf4e75 quoted line counts from four commits earlier and linked blob/0ae1b34; the PR was at
      exactly the 250-line budget and the duplication the finding named had already been removed.
      Both directions are harmful. A stale read can block a clean PR, which is what happened, and it can
      equally pass a PR whose defect was introduced in the commit it did not read -- and the SHA-bound
      marker does not protect against that. The marker binds the verdict to a commit; it does not bind
      the READING to that commit.
    scope:
      - "establish whether the cause is the action's checkout, gh pr diff caching, or the prompt"
      - "make the reviewer state which SHA it read, in the summary, so a stale read is visible without archaeology"
      - "consider having the proof step compare the SHA the reviewer names against the head it is verifying"
      - "a re-run that flips a verdict is indistinguishable from remediating this bug: decide whether the gate should record who triggered a re-run and why, or refuse a pass that only appeared after one"
    acceptance:
      - "the summary review names the SHA whose content was read"
      - "a review whose read SHA differs from the head SHA does not produce a pass marker (test or recorded run)"
      - "a normal review still passes unchanged -- the fix must not add a failure mode of its own"
      - "the three observed cases are re-checked against the fix and the results recorded"
      - "PR 60 is the worked example: changes-requested and pass on the identical SHA, 3h56m apart, the second after a re-run"

  - id: M-15
    title: "A second review workflow reports SUCCESS on every PR and posts no verdict"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    refs: "16.1, 16.2"
    goal: |
      Two workflows review every PR, and only one of them carries a verdict.

      `claude-review.yml` (workflow "Claude PR review", job `review`) is the real gate: it runs the
      reviewer and then proves, in the SAME job and the NEXT step, that a SHA-bound marker from
      claude[bot] exists for the head it is verifying. `claude-code-review.yml` (workflow "Claude Code
      Review", job `claude-review`) independently runs the generic `/code-review` plugin with only
      `create_inline_comment` allowed. It cannot call `gh pr review`, so it can never emit a marker,
      and it has no proof step -- so it reports SUCCESS on every PR regardless of what it found.

      That green is the defect. It is the same shape as M-01: a check that decided nothing must not
      report success. The two check names sit adjacent in the PR check list as `claude-review`
      (always green, decides nothing) and `review` (the actual verdict), and the green one is named
      almost exactly like the marker string `claude-review: pass`. On 2026-09-12 all three of PRs 70,
      71 and 72 showed `claude-review SUCCESS` beside a red `review`, and the pairing was read as the
      marker-posting reviewer finishing late and losing a race to the proof step.

      IT IS NOT A RACE, and this entry exists partly to stop that hypothesis being re-filed. Measured
      on the attempt-1 logs of runs 34710013508 (PR 70), 34710218114 (PR 72) and 34710271725 (PR 71):
      the `Prove the review actually ran` step started and failed within ONE second in all three, and
      in all three it printed "CHANGES REQUESTED: claude[bot] found blocking findings (B1/B2)" for the
      exact head SHA. The marker was present and found immediately. A structural race is not available
      here either: unlike guardrails.yml, which fires on `synchronize` as a separate workflow observing
      another workflow's output and therefore genuinely raced (M-14), the proof step in claude-review.yml
      runs after the reviewer step inside one job. It cannot start early. Adding M-14's polling to it
      would only delay every correct rejection by the length of the poll, and would invite a later
      "fix" that treats an absent marker as a pass -- which is the one failure this gate exists to
      prevent.

      The 12-14 minutes the duplicate takes is also paid on every push, for a second full-repo review
      whose findings nothing gates on.
    scope:
      - "decide whether claude-code-review.yml is wanted at all: it duplicates the reviewer that already runs, at full token cost per push"
      - "if it is kept, it must not report SUCCESS for a run that reached no verdict -- M-01's rule applies to it too"
      - "if it is kept, rename the job so it is not confusable with the `review` check or the `claude-review: pass` marker string"
      - "owner-only path: .github/workflows/** is denied to agents by .claude/settings.json, so this is filed and parked, never self-applied"
    acceptance:
      - "the PR check list contains exactly one check that can be mistaken for the verdict, and it is the one that carries it"
      - "no check reports SUCCESS for a review that produced no verdict"
      - "a changes-requested PR shows no green review-shaped check anywhere in its list"
      - "the no-race finding above is preserved in the record so the polling fix is not re-proposed"

  # ------------------------------------------------------- Development scaffolding
  # Authored 2026-09-13 by the orchestrator under the owner's standing instruction:
  # "If the slice needs something the backlog does not cover -- a dev script, seed data, a way to
  # create a Project and a Task so the UI has something to show -- author the issue yourself, groom
  # it with a budget, and build it." Seed data is development scaffolding. It is NOT a migration,
  # and nothing in it may ever be depended on by production code.
  - id: D-01
    title: "Development seed data and a one-command dev run"
    phase: 0
    agent: spine-engineer
    size: S
    depends_on: [P0-05]
    refs: "14.1, 14.2, 15.2"
    change_budget: 400
    budget_reason: "scaffolding, not mechanics: rows, events and two npm scripts"
    goal: |
      Two commands take a clean clone to durable state worth rendering, so the gateway and the web
      shell have real snapshot and event history to read instead of a fixture. Every row the seed
      writes is ordinary durable truth -- same tables, same append path, same replay guarantees --
      so nothing downstream needs a "is this seeded?" branch.
      Seed data is development scaffolding and is labelled as such at every layer. It is not a
      migration: it does not live in migrations/, does not change the schema, and does not run as
      part of migrate().
    scope:
      - "scripts/seed.ts, run as `pnpm seed`: one owner, one org node, one role, one member, one project, several tasks"
      - "events appended through appendEvent so seeded history replays through readSince like any other"
      - "seeded tasks span distinct attention-relevant states, including at least one whose basis is genuinely unknown"
      - "writes to a dev database under state/, gitignored, never a production path"
      - "refuses to run against a non-empty database unless --reset is passed"
      - "console output states plainly that this is development seed data"
      - "`pnpm dev` script; it starts the gateway once P0-09 lands, and says so honestly until then"
    acceptance:
      - "pnpm seed on a clean clone produces a database whose event log replays contiguously from seq 0"
      - "at least one seeded task is in a state that must render as unknown, not as a guess (invariant 1)"
      - "re-running pnpm seed without --reset refuses rather than duplicating or silently upserting"
      - "every seeded row carries owner_id and org_node_id (invariant 8); identity audit passes"
      - "the seed does not import from, write to, or register itself with packages/persistence/src/migrations"
      - "pnpm verify passes with the seed script in the tree"
