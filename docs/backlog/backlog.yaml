  - id: M-01
    title: "Fix gate-check.sh: correct pnpm invocation and report UNPROVEN for an empty scan"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    refs: "20, 22, 23"
    goal: |
      A gate check that cannot be trusted is worse than no gate check. Two lines of phase-0 output are
      currently wrong in opposite directions, so the script must be repaired before any gate verdict is
      treated as meaningful.
    scope:
      - "condition 0.2 runs `pnpm -s verify`, which pnpm 12 rejects with `unexpected argument '-s'`, so it reports FAIL unconditionally; use `pnpm --silent run verify`"
      - "condition 0.1 prints PASS when the audits scanned nothing, because every check is guarded by `[[ -d ]]` over directories that may not exist; it must print UNPROVEN instead"
      - "distinguish 'the check ran and passed' from 'the check had nothing to look at' everywhere in the script"
    acceptance:
      - "0.2 reflects the real exit status of the verify script, proven by running it against a branch where verify passes and one where it fails"
      - "0.1 reports UNPROVEN, not PASS, when packages/ apps/ adapters/ are absent, and PASS only when the audits actually scanned files"
      - "an empty scan can never produce a PASS anywhere in the script (test)"
      - "`./scripts/gate-check.sh 0` output is reproduced in the evidence comment for both the passing and the empty case"

  - id: M-02
    title: "Widen audit patterns to catch compound identifiers and scan config/ for identity"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must apply the audit-script patches, or grant an agent Edit on scripts/audit-*.sh (both are in the settings deny list)"
    refs: "21"
    goal: |
      Invariants 8 and 9 are currently enforced against prose more than against code. The audits match bare
      words, but real TypeScript writes commitSha and commit_sha, so the vocabulary rules leak exactly where
      the code will be written.
    scope:
      - "seam audit must catch compound and plural forms: commitSha, commit_sha, gitRef, commits, merged, diffs"
      - "identity audit must catch IsOwner and is_owner as well as isOwner/isMe"
      - "identity audit must scan config/ in addition to packages/, apps/, adapters/"
      - "the `.test.`/`.spec.` exemption must match the file path only, not any line whose content happens to contain that substring"
      - "keep the adapters/domain/code and adapters/host/darwin carve-outs intact"
      - "add a provider-vocabulary pattern (vendor and runtime names) scanned outside adapters/provider/, folded in from P0-02 acceptance 3 -- see docs/adr/0004-protocol-event-vocabulary.md"
    acceptance:
      - "each of commitSha, commit_sha, gitRef, commits in packages/domain fails the seam audit (test)"
      - "each of IsOwner, is_owner, isOwner in packages/, apps/, adapters/, config/ fails the identity audit (test)"
      - "`export const commit = 1; // see foo.test.ts` fails, while a genuine packages/domain/x.test.ts file is still exempt (test)"
      - "git vocabulary in adapters/domain/code and macOS vocabulary in adapters/host/darwin still pass (test)"
      - "no audit is weakened: every violation class the audits caught before this issue still fails"
      - "no false positives: different, difference, commitment and branchless still pass in packages/domain (test)"
      - "basis_ref and basis.ref still pass -- they are the mandated core vocabulary (CLAUDE.md section 3, blueprint 12.3), not a leak (test)"
      - "a vendor name in packages/protocol fails the seam audit, while the same name inside adapters/provider/ passes (test)"
      - "actor.runtime_id in packages/protocol still passes -- it is the Seam D spelling mandated by blueprint 25.1, not a leak (test)"

  - id: M-03
    title: "CI workflow as tracked configuration"
    phase: 0
    agent: contract-test-engineer
    size: S
    depends_on: [P0-01]
    blocked_gate: "owner must apply the workflow change, or grant an agent Edit on .github/workflows/** (it is in the settings deny list)"
    refs: "20, 22"
