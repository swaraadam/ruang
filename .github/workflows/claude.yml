name: Claude

# On-demand path: mention @claude in a PR/issue comment or a PR review comment to get
# a follow-up (re-review, answer a question, explain a change anchor). The automatic
# review on PR open and on every push lives in claude-review.yml.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: ${{ contains(github.event.comment.body, '@claude') || contains(github.event.review.body, '@claude') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Claude Code workspace trust
        run: |
          python3 -c "
          import json, os
          p = os.path.expanduser('~/.claude.json')
          try:
              c = json.load(open(p))
          except (FileNotFoundError, json.JSONDecodeError):
              c = {}
          c.setdefault('projects', {}).setdefault(os.environ['GITHUB_WORKSPACE'], {})['hasTrustDialogAccepted'] = True
          json.dump(c, open(p, 'w'), indent=2)
          "

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
