name: guardrails

on: [pull_request]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protected files require owner-approved label
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          PROTECTED=$(echo "$CHANGED" | grep -E '^(\.claude/settings\.json|\.github/workflows/|scripts/audit-(seams|identity)\.sh|CLAUDE\.md)' || true)

          if [ -n "$PROTECTED" ]; then
            echo "Guardrail files changed:"
            echo "$PROTECTED"

            echo "${{ join(github.event.pull_request.labels.*.name, ' ') }}" | grep -qw owner-approved \
              || { echo "Missing owner-approved label — refusing."; exit 1; }
          fi
