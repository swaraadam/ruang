name: Claude PR review

# Reviews every non-draft PR and re-reviews on every push to it.
#
# WHY `synchronize` IS NOT GATED ON A LABEL, unlike the repo this pattern came from.
# There, a push only re-reviews while `changes-requested` is present, which is safe
# because a human does the merging and sees the new commits. Here the merge can be
# unattended, so a clean review followed by a push would otherwise leave a stale
# `review-passed` on code nobody read. The verdict marker below is bound to the head
# SHA, so a push invalidates it by construction and a fresh review must produce a new
# one. Reviewing every push is what makes that binding honest rather than decorative.
#
# The 250-line change budget (CLAUDE.md section 10) keeps the per-push cost bounded.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

# One review per PR at a time; a rapid push supersedes the in-flight run.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are caught later on ready_for_review. Bot-authored PRs are not reviewed.
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write # claude-code-action mints its GitHub App token via OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # the diff comes via gh, not history

      # A missing or expired token makes claude-code-action a no-op that still exits 0.
      # Measured on PR 49: the action took 4s, posted nothing, revoked no token, and the
      # job went green. A check that could not run must never report success -- M-01, and
      # invariant 1: unknown must look unknown.
      - name: Refuse to run without a token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || {
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set. The review cannot run, so this check"
            echo "must not be green. Install the Claude GitHub App and set the secret."
            exit 1
          }

      - name: Configure Claude Code workspace trust
        run: |
          python3 -c "
          import json, os
          p = os.path.expanduser('~/.claude.json')
          try:
              c = json.load(open(p))
          except (FileNotFoundError, json.JSONDecodeError):
              c = {}
          c.setdefault('projects', {}).setdefault(os.environ['GITHUB_WORKSPACE'], {})['hasTrustDialogAccepted'] = True
          json.dump(c, open(p, 'w'), indent=2)
          "

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request non-interactively: do NOT ask questions or wait
            for input. Produce the review and submit it.

            Follow .claude/skills/review-pr/SKILL.md exactly. In short: read the
            invariants in CLAUDE.md section 2 and the blueprint section the issue
            names, review every changed file against B1/B2/A3/A4, leave a per-line
            inline comment for each specific finding, then post exactly ONE summary
            formal review FOR THIS RUN with
              gh pr review ${{ github.event.pull_request.number }} --comment --body "..."
            (a pull_request_review, NOT gh pr comment), then apply the verdict label
            and, only on a pass, the SHA-bound marker.

            The two labels are EXCLUSIVE: adding one must remove the other, so
            `gh pr edit N --add-label review-passed --remove-label changes-requested`
            and the reverse. A label left behind after a fix leaves the PR reading as
            rejected for a finding that no longer exists.

            THE MARKER IS LOAD-BEARING. The landing gate merges on it, unattended.
            Every run MUST end its summary review with exactly one marker line, as the
            last line, nothing else on that line:

              no B1 and no B2 finding:
                claude-review: pass @ ${{ github.event.pull_request.head.sha }}
              any B1 or B2 finding:
                claude-review: changes-requested @ ${{ github.event.pull_request.head.sha }}

            Both are SHA-bound on purpose. A bare label cannot say WHICH commit it
            judged, so a stale `changes-requested` from an earlier push would otherwise
            read as a verdict on code that was never reviewed. Take the SHA from this prompt, never from
            memory. Never emit it for a PR that touches a guardrail path
            (CLAUDE.md, .claude/settings.json, .github/workflows/**,
            scripts/audit-seams.sh, scripts/audit-identity.sh) -- those are the
            owner's to approve, and the gate refuses them regardless.

            A PREVIOUS REVIEW ON THIS PR IS NOT A REASON TO STAY SILENT. Later runs
            exist precisely because the code changed after that review, so review the
            diff as it now stands and post for this run. Only duplicate summaries
            WITHIN one run are forbidden.

            Advisory only: never --request-changes or --approve.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh issue view:*),Bash(gh api:*)"

      # Green must mean "a review happened", not "the action exited 0". The landing gate
      # reads the marker rather than this check, so a silent no-op would fail closed there
      # anyway -- but a green check that reviewed nothing misleads the human reading the PR.
      - name: Prove the review actually ran
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # claude-code-action refuses to run when a workflow file on the PR branch differs
          # from the copy on the default branch -- its own protection against a PR editing the
          # workflow to reach the secrets. It reports that skip as SUCCESS, which is how a
          # no-op review reaches a green check. Such a PR is a guardrail change: owner-approved
          # and owner-merged, never auto-merged, so it needs no marker. Say why, and fail --
          # `claude-review` is not a required check, so a red one here blocks nothing.
          if gh pr diff "$PR" --repo "$REPO" --name-only | grep -q '^\.github/workflows/'; then
            echo "This PR changes .github/workflows/, so claude-code-action skips itself by"
            echo "design and no review can run. That is expected. The PR is a guardrail change:"
            echo "it needs the owner-approved label and an owner merge, not a review marker."
            exit 1
          fi

          # Only reviews posted BY THE APP count. An unfiltered read would accept a marker
          # written by any account with comment access -- including the PR author's own,
          # the identity this mechanism exists to exclude. PR comments are not a source at
          # all for the same reason; only the reviews API, filtered on the poster.
          bodies=$(gh api "repos/$REPO/pulls/$PR/reviews" \
                     -q '.[] | select(.user.login == "claude[bot]") | .body' || true)

          if printf '%s\n' "$bodies" | grep -Fxq "claude-review: pass @ $HEAD_SHA"; then
            echo "pass marker from claude[bot] for $HEAD_SHA"
          elif printf '%s\n' "$bodies" | grep -Fxq "claude-review: changes-requested @ $HEAD_SHA"; then
            echo "changes-requested marker from claude[bot] for $HEAD_SHA"
          else
            echo "No claude[bot] verdict for $HEAD_SHA."
            echo "A verdict for an earlier commit does not count: it judged different code."
            echo "The review did not complete. Refusing to report success."
            exit 1
          fi
